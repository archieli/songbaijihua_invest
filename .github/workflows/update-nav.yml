name: Update market data

on:
  schedule:
    # 每周一 北京时间 07:00（UTC 23:00 周日）
    - cron: '0 23 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch recent prices
        run: node scripts/fetch-nav.mjs --since
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/nav
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update market data $(date -u +%Y-%m-%d)"
            git push
          fi
